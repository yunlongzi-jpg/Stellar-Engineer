<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宇宙星尘 · 再造太阳系</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ============ 开始画面 ============ -->
  <div id="screen-start" class="screen">
    <div class="start-box">
      <div class="logo">✦</div>
      <h1>宇宙星尘</h1>
      <div class="subtitle">再造太阳系 · STELLAR ENGINEER</div>
      <div class="starfield"></div>

      <div class="mode-select">
        <label class="mode-card">
          <input type="radio" name="mode" value="ai" checked>
          <div class="mode-title">🤖 单人对战 AI</div>
          <div class="mode-desc">与 1-3 个 AI 对手竞逐再造太阳系</div>
        </label>
        <label class="mode-card">
          <input type="radio" name="mode" value="hotseat">
          <div class="mode-title">👥 多人热座</div>
          <div class="mode-desc">2-4 名玩家轮流操作，切换时遮蔽手牌</div>
        </label>
      </div>

      <div class="count-row" id="count-row">
        <span class="name-label" id="count-label">对手数量</span>
        <div class="count-select" id="count-select"></div>
      </div>

      <div id="player-rows"></div>

      <button id="btn-start" class="btn btn-primary btn-lg">🚀 开始游戏</button>
      <button id="btn-help-open" class="btn btn-ghost">📖 玩法说明</button>
      <div class="credit">改编自桌面游戏《再造太阳系》 · 网页版为规则适配实现</div>
    </div>
  </div>

  <!-- ============ 游戏画面 ============ -->
  <div id="screen-game" class="screen hidden">
    <header id="topbar">
      <div class="brand">✦ 宇宙星尘</div>
      <div id="turn-info"></div>
      <div class="top-actions">
        <button id="btn-help-game" class="btn btn-ghost btn-sm" title="玩法说明">📖</button>
        <button id="btn-restart" class="btn btn-ghost btn-sm">🔄 重新开始</button>
      </div>
    </header>

    <main id="layout">
      <section id="board"></section>
      <aside id="side">
        <div id="players-panel" class="panel"></div>
        <div id="supply-panel" class="panel"></div>
        <div id="log-panel" class="panel"></div>
      </aside>
    </main>

    <footer id="bottom">
      <div id="phase-banner"></div>
      <div id="hand-cards"></div>
      <div id="action-bar"></div>
    </footer>
  </div>

  <!-- 填充选择抽屉 -->
  <div id="fill-drawer" class="hidden">
    <div class="drawer-head"><span id="drawer-title"></span><button id="drawer-close" class="btn-x">✕</button></div>
    <div id="drawer-body"></div>
  </div>

  <!-- 通用模态（工具参数） -->
  <div id="modal" class="overlay hidden"><div class="modal-box" id="modal-box"></div></div>

  <!-- 热座隐私遮罩 -->
  <div id="overlay-mask" class="overlay hidden">
    <div class="mask-box">
      <div class="mask-icon">🌌</div>
      <div class="mask-title">请将设备交给</div>
      <div class="mask-name" id="mask-name"></div>
      <div class="mask-desc">手牌已隐藏，准备好后点击下方按钮</div>
      <button id="mask-btn" class="btn btn-primary btn-lg">我已就位，开始回合</button>
    </div>
  </div>

  <!-- 终局画面 -->
  <div id="overlay-gameover" class="overlay hidden">
    <div class="modal-box gameover-box" id="gameover-box"></div>
  </div>

  <!-- 玩法说明 -->
  <div id="help-modal" class="overlay hidden">
    <div class="modal-box help-box" id="help-content"></div>
  </div>

  <div id="toast" class="hidden"></div>
</div>

<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/ai.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
